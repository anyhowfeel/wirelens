[package]
name = "wl-app"
version.workspace = true
edition.workspace = true
description = "Prototype desktop packet viewer on top of tshark"

[[bin]]
name = "wirelens"
path = "src/main.rs"

[dependencies]
wl-model.workspace = true
wl-tshark.workspace = true
wl-stats.workspace = true
wl-kit.workspace = true
wl-panels.workspace = true
eframe.workspace = true
crossbeam-channel.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
clap = { version = "4", features = ["derive"] }
dirs = "7"
rfd = "0.18"
signal-hook = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif"] }
mimalloc = "0.1.52"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true

[package.metadata.deb]
name = "wirelens"
maintainer = "anyhowfeel <346877873+anyhowfeel@users.noreply.github.com>"
copyright = "wirelens contributors"
license-file = ["../../LICENSE", "0"]
section = "net"
priority = "optional"
depends = "$auto, tshark"
extended-description = "Prototype desktop packet viewer written in Rust with egui. Captures are read and filtered by tshark and dumpcap; wirelens shows them as tables, charts and a host graph."
assets = [
    ["target/release/wirelens", "usr/bin/", "755"],
    ["../../packaging/linux/wirelens.desktop", "usr/share/applications/", "644"],
    ["../../README.md", "usr/share/doc/wirelens/README.md", "644"],
    ["../../CHANGELOG.md", "usr/share/doc/wirelens/CHANGELOG.md", "644"],
]
